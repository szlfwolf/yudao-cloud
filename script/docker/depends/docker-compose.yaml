name: ruoyi-vue-pro
version: '3.8'
services:
  mysql:
    image: mysql:8.0.33
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ruoyi-vue-pro
    ports:
      - "3306:3306"
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql/
      # 注入初始化脚本
      - ../../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
  redis:
    image: redis:7.2.4
    restart: unless-stopped
    container_name: 'redis'
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --port 6379 --appendonly yes --protected-mode no
  nacos:
    image: nacos/nacos-server:v2.4.3
    restart: unless-stopped
    container_name: nacos-standalone
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
    volumes:
      - ./volumes/nacos/logs:/home/nacos/logs
    ports:
      - "8848:8848"
      - "9848:9848"

  # xxl-job 分布式调度中心
  xxl-job:
    image: xuxueli/xxl-job-admin:2.3.0
    restart: unless-stopped
    container_name: xxl-job
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?Unicode=true&characterEncoding=UTF-8  --spring.datasource.username=root --spring.datasource.password=123456 --server.port=9001
    depends_on:
      - mysql
    links:
      - "mysql:mysql"
    volumes:
      - ./volumes/xxl-job/logs:/data/applogs
    ports:
      - "9001:9001"

  namesrv:
    image: apache/rocketmq:5.3.1
    container_name: rmqnamesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    networks:
      - rocketmq
    command: sh mqnamesrv
  broker:
    image: apache/rocketmq:5.3.1
    container_name: rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - namesrv
    networks:
      - rocketmq
    command: sh mqbroker
  proxy:
    image: apache/rocketmq:5.3.1
    container_name: rmqproxy
    networks:
      - rocketmq
    depends_on:
      - broker
      - namesrv
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: unless-stopped
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    command: sh mqproxy
networks:
  rocketmq:
    driver: bridge